title: "[Idea] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are discussed here before they become issues. Check [ROADMAP.md](https://github.com/koda-tokyo/kolo/blob/main/ROADMAP.md) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you want to do and why the current product makes it hard.
    validations:
      required: true
  - type: textarea
    id: sketch
    attributes:
      label: Sketch
      description: Rough shape of the change (commands, config, behaviour). Partial is fine.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI and terminal UI
        - gateway, API, sessions, jobs
        - tools, MCP, Code Mode, language servers
        - providers and models
        - channels
        - packaging and operations
        - security and governance
        - documentation
